plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlinx.serialization)
    alias(libs.plugins.apollo3)
    alias(libs.plugins.detekt)
    alias(libs.plugins.compose.compiler)
}

apollo {
    packageName.set("cz.minarik.rickandmorty")
    generateKotlinModels.set(true)
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "cz.minarik.rickandmorty"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
        kotlinCompilerVersion kotlin_version
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    namespace 'cz.minarik.rickandmorty'
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.javax.inject

    // tests
    testImplementation libs.kotest.runner.junit5.jvm
    testImplementation libs.mockk
    androidTestImplementation libs.mockk.android
    androidTestImplementation libs.kotest.runner.junit5.jvm
    androidTestImplementation libs.kotest.assertions.core.jvm
    androidTestImplementation libs.androidx.rules
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.core.ktx
    androidTestImplementation libs.androidx.core

    //compose navigation
    implementation(libs.androidx.navigation.compose)

    //Compose
    def composeBom = libs.androidx.compose.bom
    implementation composeBom
    implementation libs.androidx.compose.foundation
    androidTestImplementation composeBom
    implementation libs.viewmodel.compose
    // Android Studio Preview support
    implementation libs.androidx.ui.tooling.preview
    debugImplementation libs.androidx.ui.tooling

    // Koin for Android
    implementation libs.koin.android
    implementation libs.koin.androidx.compose

    //retrofit + okhttp
    implementation libs.retrofit
    implementation libs.okhttp
    implementation libs.logging.interceptor
    implementation(libs.retrofit2.kotlinx.serialization.converter)
    implementation libs.kotlinx.serialization.json

    //Coil
    implementation(libs.coil.compose)
    implementation libs.coil.svg

    //Swipe Refresh layout for Jetpack Compose
    implementation libs.accompanist.swiperefresh

    //DataStore
    implementation(libs.androidx.datastore.preferences)         \

    // apollo
    implementation(libs.apollo.runtime)
    implementation libs.apollo.coroutines.support

    // paging
    implementation libs.androidx.paging.runtime.ktx
    implementation libs.androidx.paging.compose

    implementation libs.timber

    implementation libs.accompanist.pager
    implementation libs.accompanist.pager.indicators
}

apollo {
    generateKotlinModels.set(true)
}
